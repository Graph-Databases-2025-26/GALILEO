llm_provider: "watsonx"

database:
  run:  GEO, Movies

execution:
  max_retries: 3
  backoff_sec: 1.5
  scan: "auto"

io:
  queries_dir: "../data"
  prompts_dir: "./prompts"
  outputs_dir: "data/.outputs"

logging:
  level: "INFO"
  json_format: true

gemini:
  model: "gemini-2.5-flash"
  temperature: 0.7
  max_output_tokens: 2000

watsonx:
  model: "meta-llama/llama-3-3-70b-instruct"
  temperature: 0.7
  max_tokens: 1000